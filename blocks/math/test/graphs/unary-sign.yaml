# Sign: -1, 0 or +1 by the sign of the sample; NaN stays NaN.
#   -3.5 0 0.25 7 NaN -> -1 0 1 1 NaN
blocks:
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32 [-3.5, 0.0, 0.25, 7.0, .nan]
  - id: gr::blocks::math::Sign<float32>
    parameters:
      name: sign_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [-1.0, 0.0, 1.0, 1.0, .nan]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [-3.5, 0.0, 0.25, 7.0, .nan]
  - id: gr::blocks::math::Sign<float64>
    parameters:
      name: sign_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [-1.0, 0.0, 1.0, 1.0, .nan]
connections:
  - [source_f32, out, sign_f32, in]
  - [sign_f32, out, sink_f32, in]
  - [source_f64, out, sign_f64, in]
  - [sign_f64, out, sink_f64, in]
