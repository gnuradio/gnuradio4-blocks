# Log10: out = log10(in) * scale + offset.
#   plain:                 1 10 100 0.001 0 -1 -> 0 1 2 -3 -inf NaN
#   dB, scale 10:          1 10 100 0.5        -> 0 10 20 -3.010299956639812
#   dB, scale 10, offset -30 (milliwatts to dBW): 1 10 1000 0.001 -> -30 -20 0 -60
blocks:
  - id: gr::blocks::basic::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32 [1.0, 10.0, 100.0, 0.001, 0.0, -1.0]
  - id: gr::blocks::math::Log10<float32>
    parameters:
      name: log10_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [0.0, 1.0, 2.0, -3.0, -.inf, .nan]
      relative_tolerance: 1e-6
      tolerance: 1e-6
  - id: gr::blocks::basic::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [1.0, 10.0, 100.0, 0.001, 0.0, -1.0]
  - id: gr::blocks::math::Log10<float64>
    parameters:
      name: log10_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [0.0, 1.0, 2.0, -3.0, -.inf, .nan]
      relative_tolerance: 1e-12
      tolerance: 1e-12
  - id: gr::blocks::basic::VectorSource<float32>
    parameters:
      name: source_f32_db
      values: !!float32 [1.0, 10.0, 100.0, 0.5]
  - id: gr::blocks::math::Log10<float32>
    parameters:
      name: log10_f32_db
      scale: !!float32 10.0
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32_db
      expected: !!float32 [0.0, 10.0, 20.0, -3.010299956639812]
      relative_tolerance: 1e-6
      tolerance: 1e-6
  - id: gr::blocks::basic::VectorSource<float64>
    parameters:
      name: source_f64_dbw
      values: !!float64 [1.0, 10.0, 1000.0, 0.001]
  - id: gr::blocks::math::Log10<float64>
    parameters:
      name: log10_f64_dbw
      scale: !!float64 10.0
      offset: !!float64 -30.0
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64_dbw
      expected: !!float64 [-30.0, -20.0, 0.0, -60.0]
      relative_tolerance: 1e-12
      tolerance: 1e-12
connections:
  - [source_f32, out, log10_f32, in]
  - [log10_f32, out, sink_f32, in]
  - [source_f64, out, log10_f64, in]
  - [log10_f64, out, sink_f64, in]
  - [source_f32_db, out, log10_f32_db, in]
  - [log10_f32_db, out, sink_f32_db, in]
  - [source_f64_dbw, out, log10_f64_dbw, in]
  - [log10_f64_dbw, out, sink_f64_dbw, in]
