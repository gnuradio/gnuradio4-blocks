# Real: out = re(in), complex in, float32 out.
#   (1,-2) (0,0) (-3.5,4) -> 1 0 -3.5
blocks:
  - id: gr::blocks::basic::VectorSource<complex<float32>>
    parameters:
      name: source_c32
      values: !!complex32
        - (1.0, -2.0)
        - (0.0, 0.0)
        - (-3.5, 4.0)
  - id: gr::blocks::math::Real<complex<float32>>
    parameters:
      name: real_c32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_c32
      expected: !!float32 [1.0, 0.0, -3.5]
connections:
  - [source_c32, out, real_c32, in]
  - [real_c32, out, sink_c32, in]
