# Log2: out = log2(in).
#   1 8 0.5 0 -2 -> 0 3 -1 -inf NaN
blocks:
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32 [1.0, 8.0, 0.5, 0.0, -2.0]
  - id: gr::blocks::math::Log2<float32>
    parameters:
      name: log2_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [0.0, 3.0, -1.0, -.inf, .nan]
      relative_tolerance: 1e-6
      tolerance: 1e-6
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [1.0, 8.0, 0.5, 0.0, -2.0]
  - id: gr::blocks::math::Log2<float64>
    parameters:
      name: log2_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [0.0, 3.0, -1.0, -.inf, .nan]
      relative_tolerance: 1e-12
      tolerance: 1e-12
connections:
  - [source_f32, out, log2_f32, in]
  - [log2_f32, out, sink_f32, in]
  - [source_f64, out, log2_f64, in]
  - [log2_f64, out, sink_f64, in]
