# Tanh: out = sinh(in) / cosh(in).
#   0 atanh(0.5) -atanh(0.5) 20 -> 0 0.5 -0.5 1
blocks:
  - id: gr::blocks::basic::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32
        - 0.0
        - 0.5493061443340549
        - -0.5493061443340549
        - 20.0
  - id: gr::blocks::math::Tanh<float32>
    parameters:
      name: tanh_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [0.0, 0.5, -0.5, 1.0]
      relative_tolerance: 1e-6
      tolerance: 1e-6
  - id: gr::blocks::basic::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64
        - 0.0
        - 0.5493061443340549
        - -0.5493061443340549
        - 20.0
  - id: gr::blocks::math::Tanh<float64>
    parameters:
      name: tanh_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [0.0, 0.5, -0.5, 1.0]
      relative_tolerance: 1e-12
      tolerance: 1e-12
connections:
  - [source_f32, out, tanh_f32, in]
  - [tanh_f32, out, sink_f32, in]
  - [source_f64, out, tanh_f64, in]
  - [tanh_f64, out, sink_f64, in]
