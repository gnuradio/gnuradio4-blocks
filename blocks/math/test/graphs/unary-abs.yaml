# Abs over its five types: out = |in|; an unsigned sample is its own absolute value.
#   uint8: 0 1 200        -> 0 1 200
#   int16: -5 0 7         -> 5 0 7
#   int32: -100000 0 3    -> 100000 0 3
#   real:  -1.5 0 2.25    -> 1.5 0 2.25
blocks:
  - id: gr::blocks::testing::VectorSource<uint8>
    parameters:
      name: source_u8
      values: [0, 1, 200]
  - id: gr::blocks::math::Abs<uint8>
    parameters:
      name: abs_u8
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: sink_u8
      expected: [0, 1, 200]
  - id: gr::blocks::testing::VectorSource<int16>
    parameters:
      name: source_i16
      values: [-5, 0, 7]
  - id: gr::blocks::math::Abs<int16>
    parameters:
      name: abs_i16
  - id: gr::blocks::testing::ExpectSink<int16>
    parameters:
      name: sink_i16
      expected: [5, 0, 7]
  - id: gr::blocks::testing::VectorSource<int32>
    parameters:
      name: source_i32
      values: [-100000, 0, 3]
  - id: gr::blocks::math::Abs<int32>
    parameters:
      name: abs_i32
  - id: gr::blocks::testing::ExpectSink<int32>
    parameters:
      name: sink_i32
      expected: [100000, 0, 3]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32 [-1.5, 0.0, 2.25]
  - id: gr::blocks::math::Abs<float32>
    parameters:
      name: abs_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [1.5, 0.0, 2.25]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [-1.5, 0.0, 2.25]
  - id: gr::blocks::math::Abs<float64>
    parameters:
      name: abs_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [1.5, 0.0, 2.25]
connections:
  - [source_u8, out, abs_u8, in]
  - [abs_u8, out, sink_u8, in]
  - [source_i16, out, abs_i16, in]
  - [abs_i16, out, sink_i16, in]
  - [source_i32, out, abs_i32, in]
  - [abs_i32, out, sink_i32, in]
  - [source_f32, out, abs_f32, in]
  - [abs_f32, out, sink_f32, in]
  - [source_f64, out, abs_f64, in]
  - [abs_f64, out, sink_f64, in]
