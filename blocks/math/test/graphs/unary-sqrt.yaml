# Sqrt: out = sqrt(in), NaN for a negative sample.
#   0 0.25 4 2 -1 -> 0 0.5 2 1.4142135623730951 NaN
blocks:
  - id: gr::blocks::basic::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32 [0.0, 0.25, 4.0, 2.0, -1.0]
  - id: gr::blocks::math::Sqrt<float32>
    parameters:
      name: sqrt_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [0.0, 0.5, 2.0, 1.4142135623730951, .nan]
      relative_tolerance: 1e-6
      tolerance: 1e-6
  - id: gr::blocks::basic::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [0.0, 0.25, 4.0, 2.0, -1.0]
  - id: gr::blocks::math::Sqrt<float64>
    parameters:
      name: sqrt_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [0.0, 0.5, 2.0, 1.4142135623730951, .nan]
      relative_tolerance: 1e-12
      tolerance: 1e-12
connections:
  - [source_f32, out, sqrt_f32, in]
  - [sqrt_f32, out, sink_f32, in]
  - [source_f64, out, sqrt_f64, in]
  - [sqrt_f64, out, sink_f64, in]
