# RadToDeg: out = (in / pi) * 180.
#   0 pi/2 -pi 1 -> 0 90 -180 57.29577951308232
blocks:
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32 [0.0, 1.5707963267948966, -3.141592653589793, 1.0]
  - id: gr::blocks::math::RadToDeg<float32>
    parameters:
      name: rad_to_deg_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [0.0, 90.0, -180.0, 57.29577951308232]
      relative_tolerance: 1e-6
      tolerance: 1e-6
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [0.0, 1.5707963267948966, -3.141592653589793, 1.0]
  - id: gr::blocks::math::RadToDeg<float64>
    parameters:
      name: rad_to_deg_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [0.0, 90.0, -180.0, 57.29577951308232]
      relative_tolerance: 1e-12
      tolerance: 1e-12
connections:
  - [source_f32, out, rad_to_deg_f32, in]
  - [rad_to_deg_f32, out, sink_f32, in]
  - [source_f64, out, rad_to_deg_f64, in]
  - [rad_to_deg_f64, out, sink_f64, in]
