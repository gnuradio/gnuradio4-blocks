# Cos: out = cos(in), in radians.
#   0 pi/3 pi -pi/2 -> 1 0.5 -1 0
blocks:
  - id: gr::blocks::basic::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32
        - 0.0
        - 1.0471975511965976
        - 3.141592653589793
        - -1.5707963267948966
  - id: gr::blocks::math::Cos<float32>
    parameters:
      name: cos_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [1.0, 0.5, -1.0, 0.0]
      relative_tolerance: 1e-6
      tolerance: 1e-6
  - id: gr::blocks::basic::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64
        - 0.0
        - 1.0471975511965976
        - 3.141592653589793
        - -1.5707963267948966
  - id: gr::blocks::math::Cos<float64>
    parameters:
      name: cos_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [1.0, 0.5, -1.0, 0.0]
      relative_tolerance: 1e-12
      tolerance: 1e-12
connections:
  - [source_f32, out, cos_f32, in]
  - [cos_f32, out, sink_f32, in]
  - [source_f64, out, cos_f64, in]
  - [cos_f64, out, sink_f64, in]
