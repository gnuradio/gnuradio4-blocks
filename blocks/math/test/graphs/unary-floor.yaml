# Floor: the largest integer value not above the sample.
#   -1.5 0 2.5 2.7 -0.2 -> -2 0 2 2 -1
# Error bound: 0; the result is an integer value the type represents exactly, so every call gives it exactly.
blocks:
  - id: gr::blocks::basic::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32 [-1.5, 0.0, 2.5, 2.7, -0.2]
  - id: gr::blocks::math::Floor<float32>
    parameters:
      name: floor_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [-2.0, 0.0, 2.0, 2.0, -1.0]
      tolerance: 0.0
      relative_tolerance: 0.0
  - id: gr::blocks::basic::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [-1.5, 0.0, 2.5, 2.7, -0.2]
  - id: gr::blocks::math::Floor<float64>
    parameters:
      name: floor_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [-2.0, 0.0, 2.0, 2.0, -1.0]
      tolerance: 0.0
      relative_tolerance: 0.0
connections:
  - [source_f32, out, floor_f32, in]
  - [floor_f32, out, sink_f32, in]
  - [source_f64, out, floor_f64, in]
  - [floor_f64, out, sink_f64, in]
