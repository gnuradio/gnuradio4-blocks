# Exp: out = e^in.
#   0 1 -1 2 -> 1 2.718281828459045 0.36787944117144233 7.38905609893065
blocks:
  - id: gr::blocks::basic::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32 [0.0, 1.0, -1.0, 2.0]
  - id: gr::blocks::math::Exp<float32>
    parameters:
      name: exp_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32
        - 1.0
        - 2.718281828459045
        - 0.36787944117144233
        - 7.38905609893065
      relative_tolerance: 1e-6
      tolerance: 1e-6
  - id: gr::blocks::basic::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [0.0, 1.0, -1.0, 2.0]
  - id: gr::blocks::math::Exp<float64>
    parameters:
      name: exp_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64
        - 1.0
        - 2.718281828459045
        - 0.36787944117144233
        - 7.38905609893065
      relative_tolerance: 1e-12
      tolerance: 1e-12
connections:
  - [source_f32, out, exp_f32, in]
  - [exp_f32, out, sink_f32, in]
  - [source_f64, out, exp_f64, in]
  - [exp_f64, out, sink_f64, in]
