# Negate over its five types: out = -in.
#   int16:  -3 0 7 32767          -> 3 0 -7 -32767
#   int32:  -3 0 7 100000         -> 3 0 -7 -100000
#   real:   -1.5 0 2.25           -> 1.5 -0 -2.25 (-0 equals 0)
#   complex: (1,-2) (0,0) (-3.5,4) -> (-1,2) (0,0) (3.5,-4)
blocks:
  - id: gr::blocks::testing::VectorSource<int16>
    parameters:
      name: source_i16
      values: [-3, 0, 7, 32767]
  - id: gr::blocks::math::Negate<int16>
    parameters:
      name: negate_i16
  - id: gr::blocks::testing::ExpectSink<int16>
    parameters:
      name: sink_i16
      expected: [3, 0, -7, -32767]
  - id: gr::blocks::testing::VectorSource<int32>
    parameters:
      name: source_i32
      values: [-3, 0, 7, 100000]
  - id: gr::blocks::math::Negate<int32>
    parameters:
      name: negate_i32
  - id: gr::blocks::testing::ExpectSink<int32>
    parameters:
      name: sink_i32
      expected: [3, 0, -7, -100000]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32 [-1.5, 0.0, 2.25]
  - id: gr::blocks::math::Negate<float32>
    parameters:
      name: negate_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [1.5, 0.0, -2.25]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [-1.5, 0.0, 2.25]
  - id: gr::blocks::math::Negate<float64>
    parameters:
      name: negate_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [1.5, 0.0, -2.25]
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: source_c32
      values: !!complex32
        - (1.0, -2.0)
        - (0.0, 0.0)
        - (-3.5, 4.0)
  - id: gr::blocks::math::Negate<complex<float32>>
    parameters:
      name: negate_c32
  - id: gr::blocks::testing::ExpectSink<complex<float32>>
    parameters:
      name: sink_c32
      expected: !!complex32
        - (-1.0, 2.0)
        - (0.0, 0.0)
        - (3.5, -4.0)
connections:
  - [source_i16, out, negate_i16, in]
  - [negate_i16, out, sink_i16, in]
  - [source_i32, out, negate_i32, in]
  - [negate_i32, out, sink_i32, in]
  - [source_f32, out, negate_f32, in]
  - [negate_f32, out, sink_f32, in]
  - [source_f64, out, negate_f64, in]
  - [negate_f64, out, sink_f64, in]
  - [source_c32, out, negate_c32, in]
  - [negate_c32, out, sink_c32, in]
