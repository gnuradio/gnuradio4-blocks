# Cosh: out = (e^in + e^-in) / 2, an even function.
#   0 ln2 -ln2 1 -> 1 1.25 1.25 1.5430806348152437, since cosh(ln 2) = (2 + 1/2) / 2
blocks:
  - id: gr::blocks::basic::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32
        - 0.0
        - 0.6931471805599453
        - -0.6931471805599453
        - 1.0
  - id: gr::blocks::math::Cosh<float32>
    parameters:
      name: cosh_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [1.0, 1.25, 1.25, 1.5430806348152437]
      relative_tolerance: 1e-6
      tolerance: 1e-6
  - id: gr::blocks::basic::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64
        - 0.0
        - 0.6931471805599453
        - -0.6931471805599453
        - 1.0
  - id: gr::blocks::math::Cosh<float64>
    parameters:
      name: cosh_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [1.0, 1.25, 1.25, 1.5430806348152437]
      relative_tolerance: 1e-12
      tolerance: 1e-12
connections:
  - [source_f32, out, cosh_f32, in]
  - [cosh_f32, out, sink_f32, in]
  - [source_f64, out, cosh_f64, in]
  - [cosh_f64, out, sink_f64, in]
