# The sink lists only `mark` at sample 1 under `tags_exact`. The source's tag there also carries `level`.
# The run must end with an error naming sample 1, the key `level` and its value, and with a nonzero exit
# status.
blocks:
  - id: gr::blocks::basic::VectorSource<float32>
    parameters:
      name: source
      values: [1.0, 2.0, 3.0, 4.0]
      tags:
        "1":
          mark: frame
          level: 3
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink
      expected: [1.0, 2.0, 3.0, 4.0]
      expected_tags:
        1:
          mark: frame
      tags_exact: true
connections:
  - [source, out, sink, in]
