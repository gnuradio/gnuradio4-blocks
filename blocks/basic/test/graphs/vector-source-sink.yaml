# VectorSource into VectorSink from a graph file. The uint32 and complex<float64> chains record every sample and tag,
# the uint32 chain two tags at one index. The float32 source repeats its values far past the sink's limit, and the run
# ends when the sink has recorded four samples. The run passes when the graph loads under the basic ids and ends.
blocks:
  - id: gr::blocks::basic::VectorSource<uint32>
    parameters:
      name: source_u32
      values: !!uint32 [0, 7, 4294967295]
      tags:
        "1":
          - mark: seven
          - level: !!uint32 3
  - id: gr::blocks::basic::VectorSink<uint32>
    parameters:
      name: sink_u32
  - id: gr::blocks::basic::VectorSource<complex<float64>>
    parameters:
      name: source_c64
      values: !!complex64
        - (1.0e300, -1.0)
        - (-2.5, 1.0e-300)
  - id: gr::blocks::basic::VectorSink<complex<float64>>
    parameters:
      name: sink_c64
  - id: gr::blocks::basic::VectorSource<float32>
    parameters:
      name: source_f32
      values: [1.0, 2.0, 3.0]
      repeat: !!uint64 1000000
  - id: gr::blocks::basic::VectorSink<float32>
    parameters:
      name: sink_f32
      n_samples_max: !!uint32 4
connections:
  - [source_u32, out, sink_u32, in]
  - [source_c64, out, sink_c64, in]
  - [source_f32, out, sink_f32, in]
