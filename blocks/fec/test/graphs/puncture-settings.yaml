      name: puncture_source
      records: {}
  - id: gr::blocks::fec::Puncture
    parameters:
      name: puncture_block
      pattern: "1110"
  - id: gr::blocks::testing::ExpectDataSetSink<uint8>
    parameters:
      name: puncture_sink
      records: {}
