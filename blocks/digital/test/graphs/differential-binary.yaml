# The binary codes. Under nrzi the encoder transitions on a zero input bit and holds on a one, and the decoder
# restores the input from item 0; the plain mod-2 encoder differs from nrzi on every other item. An input of 0 to 255
# at modulus 10 encodes and decodes as its values mod 10 do. Under 'differential' at modulus 2 the pair restores the
# input; the coded stream inverted decodes to the input with its first bit flipped, and the coded stream decoded as
# nrzi gives the complement of the input. Each sink expects its bits or symbols. generate_stream_graphs.py writes this
# file.
