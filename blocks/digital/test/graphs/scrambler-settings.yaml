# The scramblers with no item to process: AdditiveScrambler under the CCSDS settings and under the mask FF E1 1D 9A
# without repeating, and MultiplicativeScrambler and MultiplicativeDescrambler under taps 3,20 and a seed of 20 ones.
# The run passes as written. A case that changes settings through SET either runs to the end with settings the block
# accepts or ends with the block's reason for refusing them. generate_stream_graphs.py writes this file.
blocks:
  - id: gr::blocks::basic::VectorSource<uint8>
    parameters:
      name: additive_source
      values: []
  - id: gr::blocks::digital::AdditiveScrambler<uint8>
    parameters:
      name: additive_block
      taps: "1,3,5,8"
      seed: "11111111"
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: additive_sink
      expected: []
  - id: gr::blocks::basic::VectorSource<uint8>
    parameters:
      name: sequence_source
      values: []
  - id: gr::blocks::digital::AdditiveScrambler<uint8>
    parameters:
      name: sequence_block
      sequence: "FF E1 1D 9A"
      sequence_repeat: false
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: sequence_sink
      expected: []
  - id: gr::blocks::basic::VectorSource<uint8>
    parameters:
      name: scrambler_source
      values: []
  - id: gr::blocks::digital::MultiplicativeScrambler
    parameters:
      name: scrambler_block
      taps: "3,20"
      seed: "11111111111111111111"
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: scrambler_sink
      expected: []
  - id: gr::blocks::basic::VectorSource<uint8>
    parameters:
      name: descrambler_source
      values: []
  - id: gr::blocks::digital::MultiplicativeDescrambler
    parameters:
      name: descrambler_block
      taps: "3,20"
      seed: "11111111111111111111"
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: descrambler_sink
      expected: []
connections:
  - [additive_source, out, additive_block, in]
  - [additive_block, out, additive_sink, in]
  - [sequence_source, out, sequence_block, in]
  - [sequence_block, out, sequence_sink, in]
  - [scrambler_source, out, scrambler_block, in]
  - [scrambler_block, out, scrambler_sink, in]
  - [descrambler_source, out, descrambler_block, in]
  - [descrambler_block, out, descrambler_sink, in]
