# AdditiveScrambler with the CCSDS settings and its epoch boundaries. A gr:trigger_name tag at item 37 makes that item
# the first of a new epoch. Under reset_tag_value frame a tag labeled frame resets and one labeled preamble does not,
# and neither does a tag whose value is a uint32; with reset_tag_value empty the uint32 tag resets, and with
# reset_tag_key empty a frame tag does not. A reset_period of 23 over zeros repeats the first 23 bytes of the
# sequence. Under a period of 16, a tag at item 40 moves the next boundary to item 56, and a tag at item 32, on a
# boundary, is one reset. Each sink expects the epochs the boundaries name. generate_stream_graphs.py writes this
# file.
