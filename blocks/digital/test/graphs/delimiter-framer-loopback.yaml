# DelimiterFramer and DelimiterExtractor at the two ends of one link, under HDLC, SLIP, PPP and NMEA 0183 framing.
# Each source sends payloads of 1, 2, 7, 33 and 64 random bytes, upper-case letters under NMEA, each with a packet
# number. The framed sink expects each packet number and the count of items the framer inserted, and an extent of both
# delimiters, the payload items and those insertions. Through DataSetToStream the extractor's sink expects each
# payload back and a removed count equal to the inserted one. generate_graphs.py writes this file.
