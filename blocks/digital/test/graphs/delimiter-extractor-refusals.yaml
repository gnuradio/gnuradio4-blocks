          signal_values: [17, 34]
          meta_information:
            discard_reason: undersize
  - id: gr::blocks::basic::VectorSource<uint8>
    parameters:
      name: idle_source
      values: [192, 192, 17, 34, 51, 192]
  - id: gr::blocks::digital::DelimiterExtractor<uint8>
    parameters:
      name: idle_extractor
      end_delimiter: "11000000"
