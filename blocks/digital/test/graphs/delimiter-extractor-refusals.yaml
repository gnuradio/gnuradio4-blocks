  - [overrun_extractor, out, overrun_out, in]
  - [overrun_extractor, reject, overrun_reject, in]
  - [survive_source, out, survive_extractor, in]
  - [survive_extractor, out, survive_out, in]
  - [undersize_source, out, undersize_extractor, in]
  - [undersize_extractor, out, undersize_out, in]
  - [undersize_extractor, reject, undersize_reject, in]
  - [idle_source, out, idle_extractor, in]
  - [idle_extractor, out, idle_out, in]
  - [idle_extractor, reject, idle_reject, in]
  - [unaligned_source, out, unaligned_extractor, in]
  - [unaligned_extractor, out, unaligned_out, in]
  - [unaligned_extractor, reject, unaligned_reject, in]
