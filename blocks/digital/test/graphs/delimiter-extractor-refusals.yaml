# The frames DelimiterExtractor refuses and the regions it does not count as frames, each followed by a frame it
# emits. Overrun: 0xC0 delimiters over byte items with a bound of four, a five-item region and then a three-item
# frame; the reject sink expects the first four items with the reason overrun. Survive: a hundred such regions in a
# row and then a two-item frame, with the reject port unconnected. Undersize: a floor of three and a two-item region,
# refused with the reason undersize. Idle: two delimiters back to back before a three-item frame, which keeps sequence
# number 0. Unaligned: twenty bits between flags with the pack stage at eight bits, refused unpacked with the reason
# unaligned. Each block's line at stop counts what it refused. generate_graphs.py writes this file.
blocks:
  - id: gr::blocks::basic::VectorSource<uint8>
    parameters:
      name: overrun_source
      values: [192, 17, 34, 51, 68, 85, 192, 102, 119, 136, 192]
  - id: gr::blocks::digital::DelimiterExtractor<uint8>
    parameters:
      name: overrun_extractor
      end_delimiter: "11000000"
      bits_per_item: !!uint32 8
      max_payload_items: !!uint32 4
  - id: gr::blocks::testing::ExpectDataSetSink<uint8>
    parameters:
      name: overrun_out
      records:
        0:
          signal_values: [102, 119, 136]
  - id: gr::blocks::testing::ExpectDataSetSink<uint8>
    parameters:
      name: overrun_reject
      records:
        0:
          signal_values: [17, 34, 51, 68]
          meta_information:
            discard_reason: overrun
  - id: gr::blocks::basic::VectorSource<uint8>
    parameters:
      name: survive_source
      values: [
        192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1,
        2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4,
        5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192,
        1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3,
        4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5,
        192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1,
        2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4,
        5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192,
        1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3,
        4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5,
        192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1,
        2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4,
        5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192,
        1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3,
        4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5,
        192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1,
        2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4,
        5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192,
        1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 1, 2, 3, 4, 5, 192, 153, 170, 192
