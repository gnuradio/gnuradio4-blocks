# AccessCodeCorrelator distances. A 32-bit code with as many bit errors as max_errors, for each bound from 0 to 4, is
# tagged at item 72 with the distance as sync_errors in gr:trigger_meta_info, and one error more is not tagged. P25's
# 48-bit frame sync as 24 dibits at bits_per_item 2 is tagged at item 44; with one dibit wrong in both bits it is not
# tagged exactly and is tagged at a bound of one symbol. A 66-bit code at bits_per_item 3, whose first symbol
# straddles the two 64-bit limbs, is tagged at item 42; with that symbol wrong in its middle bit or in all three it is
# not tagged exactly and is tagged at a bound of one, at a distance of one. Each sink expects the stream and its tags.
# generate_stream_graphs.py writes this file.
