# CrcAppend and CrcCheck with a record's other fields, under CRC-32/ISO-HDLC. The discard chain sends a protected
# record of 24 bytes and a copy with its first bit changed to CrcCheck with discard_crc: each sink expects its record
# stripped to 24 bytes. The carried chain sends a record with a timestamp, signal fields, a trigger_name and a timing
# event at index 3 to CrcAppend, and its sink expects them all beside crc_value and crc_width, and no crc_ok. The
# verdict chain sends that protected record and a copy with bit 63 changed to CrcCheck: the passing sink expects
# crc_ok true, the received CRC, the trigger_name and the timestamp, and the failing sink crc_ok false, a crc_value
# and the trigger_name. The unconnected chain leaves the fail port unconnected and sends a damaged record, a good one
# and the damaged one again: the passing sink expects the good record alone. generate_graphs.py writes this file.
blocks:
  - id: gr::blocks::basic::DataSetSource<uint8>
    parameters:
      name: discard_source
      records:
        0:
          signal_values: [
            173, 118, 54, 116, 236, 121, 207, 234, 139, 142, 21, 3, 253, 158, 31, 255, 184, 117, 79, 25, 109, 239,
            26, 222, 38, 129, 234, 66
          ]
        1:
          signal_values: [
            172, 118, 54, 116, 236, 121, 207, 234, 139, 142, 21, 3, 253, 158, 31, 255, 184, 117, 79, 25, 109, 239,
            26, 222, 38, 129, 234, 66
          ]
  - id: gr::blocks::digital::CrcCheck
    parameters:
      name: discard_check
      width: !!uint32 32
      poly: !!uint64 79764919
      initial_value: !!uint64 4294967295
      final_xor: !!uint64 4294967295
      input_reflected: true
      result_reflected: true
      crc_byte_order: big
      discard_crc: true
  - id: gr::blocks::testing::ExpectDataSetSink<uint8>
    parameters:
      name: discard_ok
      records:
        0:
          signal_values: [
            173, 118, 54, 116, 236, 121, 207, 234, 139, 142, 21, 3, 253, 158, 31, 255, 184, 117, 79, 25, 109, 239,
            26, 222
          ]
          extents: [24]
          meta_information:
            crc_ok: true
  - id: gr::blocks::testing::ExpectDataSetSink<uint8>
    parameters:
      name: discard_fail
      records:
        0:
          signal_values: [
            172, 118, 54, 116, 236, 121, 207, 234, 139, 142, 21, 3, 253, 158, 31, 255, 184, 117, 79, 25, 109, 239,
            26, 222
          ]
          extents: [24]
          meta_information:
            crc_ok: false
  - id: gr::blocks::basic::DataSetSource<uint8>
    parameters:
      name: carried_source
      records:
