# Tags through the three differential blocks. Seven tags, six with reserved keys and one with a private_key, ride a
# stream of 240 zeros through DifferentialEncoder and DifferentialDecoder at modulus 4 and through DifferentialPhasor,
# and each reaches the sink at its own item. DifferentialPhasor drops freq_est and phase_est from a tag at item 100
# and forwards its private_key. Each sink expects zeros and every tag. generate_stream_graphs.py writes this file.
