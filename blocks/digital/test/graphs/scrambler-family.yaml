connections:
  - [pair_source, out, pair_scrambler, in]
  - [pair_scrambler, out, pair_descrambler, in]
  - [pair_descrambler, out, pair_sink, in]
  - [rate_source, out, rate_additive, in]
  - [rate_additive, out, rate_scrambler, in]
  - [rate_scrambler, out, rate_descrambler, in]
  - [rate_descrambler, out, rate_sink, in]
