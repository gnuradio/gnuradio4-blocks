# The three scramblers in chains. MultiplicativeScrambler into MultiplicativeDescrambler under form A restores the
# stream, and the private_key tag at item 11 and the gr:trigger_name tag at item 40 reach the sink at their own items.
# AdditiveScrambler under the CCSDS settings, then the multiplicative pair, carry a gr:sample_rate tag at item 50 with
# the value it arrived with. Each sink expects its items and its tags. generate_stream_graphs.py writes this file.
blocks:
  - id: gr::blocks::basic::VectorSource<uint8>
    parameters:
      name: pair_source
      values: [
        2, 182, 83, 29, 99, 143, 92, 156, 33, 101, 81, 59, 71, 151, 246, 79, 231, 250, 55, 245, 118, 224, 117, 109,
        213, 170, 163, 10, 46, 188, 119, 157, 234, 65, 7, 93, 215, 160, 19, 85, 187, 244, 107, 127, 17, 19, 105,
        217, 152, 245, 226, 245, 180, 141, 120, 238, 189, 50, 92, 54, 126, 88, 76, 54
      ]
      tags:
        "11":
          private_key: carried
        "40":
          "gr:trigger_name": frame
  - id: gr::blocks::digital::MultiplicativeScrambler
    parameters:
      name: pair_scrambler
      taps: "18,23"
      seed: "11111111111111111111111"
  - id: gr::blocks::digital::MultiplicativeDescrambler
    parameters:
      name: pair_descrambler
      taps: "18,23"
      seed: "11111111111111111111111"
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: pair_sink
      expected: [
        2, 182, 83, 29, 99, 143, 92, 156, 33, 101, 81, 59, 71, 151, 246, 79, 231, 250, 55, 245, 118, 224, 117, 109,
        213, 170, 163, 10, 46, 188, 119, 157, 234, 65, 7, 93, 215, 160, 19, 85, 187, 244, 107, 127, 17, 19, 105,
        217, 152, 245, 226, 245, 180, 141, 120, 238, 189, 50, 92, 54, 126, 88, 76, 54
      ]
      expected_tags:
        "11":
          private_key: carried
        "40":
          "gr:trigger_name": frame
      tags_exact: true
  - id: gr::blocks::basic::VectorSource<uint8>
    parameters:
      name: rate_source
      values: [
        2, 182, 83, 29, 99, 143, 92, 156, 33, 101, 81, 59, 71, 151, 246, 79, 231, 250, 55, 245, 118, 224, 117, 109,
        213, 170, 163, 10, 46, 188, 119, 157, 234, 65, 7, 93, 215, 160, 19, 85, 187, 244, 107, 127, 17, 19, 105,
        217, 152, 245, 226, 245, 180, 141, 120, 238, 189, 50, 92, 54, 126, 88, 76, 54
      ]
      tags:
        "50":
          "gr:sample_rate": !!float32 12345.0
  - id: gr::blocks::digital::AdditiveScrambler<uint8>
    parameters:
      name: rate_additive
      taps: "1,3,5,8"
      seed: "11111111"
  - id: gr::blocks::digital::MultiplicativeScrambler
    parameters:
      name: rate_scrambler
      taps: "18,23"
      seed: "11111111111111111111111"
  - id: gr::blocks::digital::MultiplicativeDescrambler
    parameters:
      name: rate_descrambler
      taps: "18,23"
      seed: "11111111111111111111111"
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: rate_sink
      expected: [
        253, 254, 93, 221, 249, 130, 44, 32, 175, 73, 194, 150, 224, 32, 176, 129, 189, 109, 74, 57, 68, 66, 202,
        83, 223, 186, 82, 130, 186, 113, 157, 44, 20, 209, 26, 220, 227, 186, 242, 44, 167, 173, 76, 36, 94, 125,
        228, 69, 45, 219, 25, 109, 209, 200, 6, 146, 169, 19, 191, 39, 87, 195, 153, 85
      ]
      expected_tags:
        "50":
