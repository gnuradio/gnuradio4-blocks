# CrcAppend alone, for each parameter set of crc-round-trip.yaml and both byte orders. The first record is the
# catalog's check input "123456789", whose CRC is the catalog's check value: 0xCBF43926 for CRC-32/ISO-HDLC, 0x29B1
# for CRC-16/IBM-3740 and 0x995DC9BBDF1939FA for CRC-64/XZ. The second is 13 bytes. Each sink expects the bytes with
# the CRC appended in the byte order set, the extent of the longer record, crc_value and crc_width, and no crc_ok.
# generate_graphs.py writes this file.
blocks:
  - id: gr::blocks::basic::DataSetSource<uint8>
    parameters:
      name: crc32_big_source
      records:
        0:
          signal_values: [49, 50, 51, 52, 53, 54, 55, 56, 57]
        1:
          signal_values: [
            173, 118, 54, 116, 236, 121, 207, 234, 139, 142, 21, 3, 253
          ]
  - id: gr::blocks::digital::CrcAppend
    parameters:
      name: crc32_big_append
      width: !!uint32 32
      poly: !!uint64 79764919
      initial_value: !!uint64 4294967295
      final_xor: !!uint64 4294967295
      input_reflected: true
      result_reflected: true
      crc_byte_order: big
  - id: gr::blocks::testing::ExpectDataSetSink<uint8>
    parameters:
      name: crc32_big_sink
      records:
        0:
          signal_values: [49, 50, 51, 52, 53, 54, 55, 56, 57, 203, 244, 57, 38]
          extents: [13]
          meta_information:
            crc_value: !!uint64 3421780262
            crc_width: !!uint64 32
          meta_absent: [crc_ok]
        1:
          signal_values: [
            173, 118, 54, 116, 236, 121, 207, 234, 139, 142, 21, 3, 253, 116, 173, 27, 7
          ]
          extents: [17]
          meta_information:
            crc_value: !!uint64 1957501703
            crc_width: !!uint64 32
          meta_absent: [crc_ok]
