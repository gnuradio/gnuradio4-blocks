# CrcAppend and CrcCheck in one chain, for each of four parameter sets and both byte orders: CRC-32/ISO-HDLC,
# CRC-16/IBM-3740, the CRC-8 of polynomial 0x07 and seed 0xFF, and CRC-64/XZ. Each source sends records of 1, 2 and 9
# bytes: as long as the 8-bit and the 16-bit CRC, and longer than the 64-bit one. The passing sink expects each record
# with its CRC appended, crc_ok true and the CRC it received, and the failing sink expects no record.
# generate_graphs.py writes this file.
blocks:
  - id: gr::blocks::basic::DataSetSource<uint8>
    parameters:
      name: crc32_big_source
      records:
        0:
          signal_values: [173]
        1:
          signal_values: [118, 54]
        2:
          signal_values: [116, 236, 121, 207, 234, 139, 142, 21, 3]
  - id: gr::blocks::digital::CrcAppend
    parameters:
      name: crc32_big_append
      width: !!uint32 32
      poly: !!uint64 79764919
      initial_value: !!uint64 4294967295
      final_xor: !!uint64 4294967295
      input_reflected: true
      result_reflected: true
      crc_byte_order: big
  - id: gr::blocks::digital::CrcCheck
    parameters:
      name: crc32_big_check
      width: !!uint32 32
      poly: !!uint64 79764919
      initial_value: !!uint64 4294967295
      final_xor: !!uint64 4294967295
      input_reflected: true
      result_reflected: true
      crc_byte_order: big
