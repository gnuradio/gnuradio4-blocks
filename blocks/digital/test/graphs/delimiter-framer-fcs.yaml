# The HDLC profile with a CRC-16/X-25 frame check sequence, low byte first, over three messages: three bytes, 24 bytes
# of 0xFF and 40 random bytes. Clean: CrcAppend, DelimiterFramer, DataSetToStream, DelimiterExtractor and CrcCheck
# with discard_crc in one chain. The framed sink expects each frame item by item, the all-ones frame with its 38
# stuffed zeros, and the passing sink each message as it was sent. Flipped: the same three frames on one stream, with
# one item of the third frame inverted inside a run of ones short enough that no stuffing decision changes. The
# passing sink expects the first two messages, and the failing sink the third. generate_graphs.py writes this file.
