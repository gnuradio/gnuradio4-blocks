  - id: gr::blocks::basic::DataSetSource<uint8>
    parameters:
      name: clean_source
      records:
        0:
          signal_values: [65, 66, 67]
          signal_names: [payload]
          signal_quantities: [""]
          signal_units: [""]
          meta_information: {}
        1:
          signal_values: [
            255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255,
            255, 255, 255
          ]
          signal_names: [payload]
          signal_quantities: [""]
          signal_units: [""]
          meta_information: {}
        2:
          signal_values: [
            173, 118, 54, 116, 236, 121, 207, 234, 139, 142, 21, 3, 253, 158, 31, 255, 184, 117, 79, 25, 109, 239,
            26, 222, 189, 228, 19, 63, 45, 125, 55, 245, 90, 236, 237, 82, 246, 9, 179, 32
