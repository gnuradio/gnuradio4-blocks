# The length guards, for each parameter set of crc-round-trip.yaml with skip_header_bytes 3. CrcCheck receives a
# record of every length up to 3 bytes plus the CRC width, which it drops, and then one byte more, which it routes:
# its failing sink expects that last record alone. CrcAppend receives records of 0 to 3 bytes, which it drops, and
# then a record of 4 bytes, which its sink expects alone with the CRC of its last byte. A last CrcCheck has
# skip_header_bytes at the largest value it holds and drops a record of 64 bytes, and both its sinks expect none.
# generate_graphs.py writes this file.
blocks:
  - id: gr::blocks::basic::DataSetSource<uint8>
    parameters:
      name: crc32_check_source
      records:
        0:
          signal_values: []
        1:
          signal_values: [90]
        2:
          signal_values: [90, 90]
        3:
          signal_values: [90, 90, 90]
        4:
          signal_values: [90, 90, 90, 90]
        5:
          signal_values: [90, 90, 90, 90, 90]
        6:
          signal_values: [90, 90, 90, 90, 90, 90]
        7:
          signal_values: [90, 90, 90, 90, 90, 90, 90]
        8:
          signal_values: [17, 17, 17, 17, 17, 17, 17, 17]
  - id: gr::blocks::digital::CrcCheck
    parameters:
      name: crc32_check_check
      width: !!uint32 32
      poly: !!uint64 79764919
      initial_value: !!uint64 4294967295
      final_xor: !!uint64 4294967295
      input_reflected: true
      result_reflected: true
      crc_byte_order: big
      skip_header_bytes: !!uint32 3
  - id: gr::blocks::testing::ExpectDataSetSink<uint8>
