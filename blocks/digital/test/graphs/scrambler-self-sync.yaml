# MultiplicativeScrambler into MultiplicativeDescrambler under the five delay sets the standards name for a self-
# synchronizing scrambler: V-series forms A and B, V.22, 802.11 DSSS and 802.3 64B/66B, each with a seed of ones. The
# pair restores bytes and single bits from item 0. A descrambler with a wrong seed restores every bit from item degree
# on, and one joined 61 bits into the stream with a zero seed restores every bit from degree bits after the join; a
# SkipHead in front of each sink drops the bits before that. Under form A with reset_period 40 at both ends the pair
# restores the stream, and a descrambler that never resets gets the first 23 bits of each later epoch wrong and the
# rest right. Each sink expects its bits. generate_stream_graphs.py writes this file.
