# The forced-transition group of the multiplicative pair: taps 3,20, a seed of 20 ones, the output inverted, and a
# complement forced at the Nth item over which the transmitted bits one and two items back stay equal. At N = 8 the
# pair restores 128 bytes and the channel carries the scrambled bytes, and the two blocks state the same count of
# firings when they stop. With force_transition_after 0 the scrambler gives what the plain recursion gives. At N = 32
# the pair restores its input, the scrambler's output differs from the plain one's, and a descrambler without the
# inversion and the rule recovers something else. Each sink expects its bytes. generate_stream_graphs.py writes this
# file.
