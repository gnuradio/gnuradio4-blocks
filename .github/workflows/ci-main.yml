name: main branch CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.run_id }}-${{ matrix.name }}
      cancel-in-progress: false
    container:
      image: ghcr.io/${{ github.repository_owner }}/gnuradio4-library-sdk:${{ matrix.library_sdk_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 24.04 | gcc-14 | Release"
            library_sdk_tag: main-ubuntu-24.04-gcc14-release
            cc: gcc-14
            cxx: g++-14
            cmake-build-type: Release
            extra_cmake_flags: ""
          - name: "Ubuntu 26.04 | gcc | Release"
            library_sdk_tag: main-ubuntu-26.04-gcc-release
            cc: gcc
            cxx: g++
            cmake-build-type: Release
            extra_cmake_flags: ""
          - name: "Ubuntu 26.04 | gcc | Debug"
            library_sdk_tag: main-ubuntu-26.04-gcc-debug
            cc: gcc
            cxx: g++
            cmake-build-type: Debug
            extra_cmake_flags: ""
          - name: "Ubuntu 24.04 | clang-20 | Release"
            library_sdk_tag: main-ubuntu-24.04-clang20-release
            cc: clang-20
            cxx: clang++-20
            cmake-build-type: Release
            extra_cmake_flags: "-DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address"
          - name: "Fedora 44 | clang | Release"
            library_sdk_tag: main-fedora-44-clang-release
            cc: clang
            cxx: clang++
            cmake-build-type: Release
            extra_cmake_flags: "-DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address"
          - name: "Fedora 44 | clang | Debug"
            library_sdk_tag: main-fedora-44-clang-debug
            cc: clang
            cxx: clang++
            cmake-build-type: Debug
            extra_cmake_flags: "-DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address"
          - name: "Ubuntu 24.04 | Emscripten | Release"
            library_sdk_tag: main-ubuntu-24.04-emscripten-release
            cc: emcc
            cxx: em++
            cmake_wrapper: emcmake
            cmake-build-type: Release
            extra_cmake_flags: ""

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure
        if: matrix.cmake_wrapper == null
        shell: bash
        env:
          CC: "${{ matrix.cc }}"
          CXX: "${{ matrix.cxx }}"
        run: |
          extra_cmake_flags=(${{ matrix.extra_cmake_flags }})
          cmake -S . -B ../build \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            -DDISABLE_EXTERNAL_DEPS_WARNINGS=ON \
            -DCMAKE_PREFIX_PATH=/opt/gnuradio4 \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DENABLE_TESTING=ON \
            "${extra_cmake_flags[@]}"

      - name: Configure CMake Emscripten
        if: matrix.cmake_wrapper == 'emcmake'
        shell: bash
        run: |
          system_node="$(command -v node)"
          emcmake cmake -S . -B ../build \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            -DDISABLE_EXTERNAL_DEPS_WARNINGS=ON \
            -DCMAKE_PREFIX_PATH=/opt/gnuradio4 \
            -DCMAKE_FIND_ROOT_PATH=/opt/gnuradio4 \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${system_node}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_TESTING=ON \
            -DGR4_ENABLE_AUDIO=OFF \
            -DGR4_ENABLE_SDR=OFF \
            -DGR4_ENABLE_HTTP_TESTS=OFF

      - name: Build
        shell: bash
        run: cmake --build ../build

      - name: Execute tests
        env:
          DISABLE_SENSITIVE_TESTS: 1
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: ctest --output-on-failure

      - name: Validate installed Emscripten SDK
        if: matrix.cmake_wrapper == 'emcmake'
        shell: bash
        run: |
          system_node="$(command -v node)"
          install_prefix="${{ runner.workspace }}/install-blocks"
          cmake --install ../build --prefix "${install_prefix}"
          emcmake cmake -S test_external/minimal_consumer -B "${{ runner.workspace }}/build-smoke" \
            -DCMAKE_PREFIX_PATH="${install_prefix};/opt/gnuradio4" \
            -DCMAKE_FIND_ROOT_PATH="${install_prefix};/opt/gnuradio4" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${system_node}"
          cmake --build "${{ runner.workspace }}/build-smoke"
          "${system_node}" "${{ runner.workspace }}/build-smoke/gnuradio4_blocks_consumer.js"
