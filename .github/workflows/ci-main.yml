name: main branch CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.run_id }}-${{ matrix.name }}
      cancel-in-progress: false
    container:
      image: ghcr.io/${{ github.repository_owner }}/gnuradio4-core-sdk:${{ matrix.core_sdk_tag }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 24.04 | gcc-14 | Release"
            require_gr3: true
            core_sdk_tag: main-ubuntu-24.04-gcc14-release
            cc: gcc-14
            cxx: g++-14
            cmake-build-type: Release
            extra_cmake_flags: ""
          - name: "Ubuntu 26.04 | gcc | Release"
            core_sdk_tag: main-ubuntu-26.04-gcc-release
            cc: gcc
            cxx: g++
            cmake-build-type: Release
            extra_cmake_flags: ""
          - name: "Ubuntu 26.04 | gcc | Debug"
            core_sdk_tag: main-ubuntu-26.04-gcc-debug
            cc: gcc
            cxx: g++
            cmake-build-type: Debug
            extra_cmake_flags: ""
          - name: "Ubuntu 24.04 | clang-20 | Release"
            core_sdk_tag: main-ubuntu-24.04-clang20-release
            cc: clang-20
            cxx: clang++-20
            cmake-build-type: Release
            extra_cmake_flags: "-DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address"
          - name: "Fedora 44 | clang | Release"
            core_sdk_tag: main-fedora-44-clang-release
            cc: clang
            cxx: clang++
            cmake-build-type: Release
            extra_cmake_flags: "-DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address"
          - name: "Fedora 44 | clang | Debug"
            core_sdk_tag: main-fedora-44-clang-debug
            cc: clang
            cxx: clang++
            cmake-build-type: Debug
            extra_cmake_flags: "-DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address"
          - name: "Ubuntu 24.04 | Emscripten | Release"
            core_sdk_tag: main-ubuntu-24.04-emscripten-release
            cc: emcc
            cxx: em++
            cmake_wrapper: emcmake
            cmake-build-type: Release
            extra_cmake_flags: ""

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare sccache usage (if available)
        id: enable_sccache
        env:
          SCCACHE_S3_ENDPOINT: ${{ vars.SCCACHE_S3_ENDPOINT }}
          SCCACHE_S3_BUCKET: ${{ vars.SCCACHE_S3_BUCKET }}
          SCCACHE_S3_REGION: ${{ vars.SCCACHE_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ vars.SCCACHE_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_KEY }}
        run: .github/ci-tools/setup_cmake_cache_flags.bash "${{ matrix.name }}"

      - name: Install GNU Radio 3 interoperability peer
        if: matrix.require_gr3 == true
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gnuradio python3-zmq
          python3 -c 'from gnuradio import blocks, gr, zeromq; import pmt; print(gr.version())'

      - name: Configure
        if: matrix.cmake_wrapper == null
        shell: bash
        env:
          CC: "${{ matrix.cc }}"
          CXX: "${{ matrix.cxx }}"
        run: |
          extra_cmake_flags=(${{ matrix.extra_cmake_flags }})
          cmake -S . -B ../build \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            -DDISABLE_EXTERNAL_DEPS_WARNINGS=ON \
            -DCMAKE_PREFIX_PATH=/opt/gnuradio4 \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            ${{ steps.enable_sccache.outputs.CXX_LAUNCHER }} \
            ${{ steps.enable_sccache.outputs.C_LAUNCHER }} \
            -DENABLE_TESTING=ON \
            -DGR4_ENABLE_ZEROMQ=ON \
            -DENABLE_EXAMPLES=ON \
            -DGR4_ENABLE_ZEROMQ_EXAMPLES=ON \
            "${extra_cmake_flags[@]}"

      - name: Configure CMake Emscripten
        if: matrix.cmake_wrapper == 'emcmake'
        shell: bash
        run: |
          system_node="$(command -v node)"
          emcmake cmake -S . -B ../build \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            -DDISABLE_EXTERNAL_DEPS_WARNINGS=ON \
            -DCMAKE_PREFIX_PATH=/opt/gnuradio4 \
            -DCMAKE_FIND_ROOT_PATH=/opt/gnuradio4 \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${system_node}" \
            ${{ steps.enable_sccache.outputs.CXX_LAUNCHER }} \
            ${{ steps.enable_sccache.outputs.C_LAUNCHER }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_TESTING=ON \
            -DGR4_ENABLE_AUDIO=OFF \
            -DGR4_ENABLE_SDR=OFF \
            -DGR4_ENABLE_ZEROMQ=OFF \
            -DGR4_ENABLE_HTTP_TESTS=OFF

      - name: Build
        shell: bash
        run: cmake --build ../build

      - name: Execute tests
        env:
          DISABLE_SENSITIVE_TESTS: 1
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: |
          unset GR4_REQUIRE_GR3_INTEROP
          if [[ "${{ matrix.require_gr3 }}" == "true" ]]; then
            export GR4_REQUIRE_GR3_INTEROP=1
          fi
          ctest --output-on-failure

      - name: Validate installed Emscripten SDK
        if: matrix.cmake_wrapper == 'emcmake'
        shell: bash
        run: |
          system_node="$(command -v node)"
          install_prefix="${{ runner.workspace }}/install-blocks"
          cmake --install ../build --prefix "${install_prefix}"
          emcmake cmake -S test_external/minimal_consumer -B "${{ runner.workspace }}/build-smoke" \
            -DCMAKE_PREFIX_PATH="${install_prefix};/opt/gnuradio4" \
            -DCMAKE_FIND_ROOT_PATH="${install_prefix};/opt/gnuradio4" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${system_node}"
          cmake --build "${{ runner.workspace }}/build-smoke"
          "${system_node}" "${{ runner.workspace }}/build-smoke/gnuradio4_blocks_consumer.js"
          emcmake cmake -S library/test_external/minimal_consumer -B "${{ runner.workspace }}/build-smoke-library" \
            -DCMAKE_PREFIX_PATH="${install_prefix};/opt/gnuradio4" \
            -DCMAKE_FIND_ROOT_PATH="${install_prefix};/opt/gnuradio4" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${system_node}"
          cmake --build "${{ runner.workspace }}/build-smoke-library"
          "${system_node}" "${{ runner.workspace }}/build-smoke-library/gnuradio4_library_consumer.js"

      - name: Show final sccache and build directory stats
        if: always()
        continue-on-error: true
        shell: bash
        run: ./.github/ci-tools/build-summary.sh "${{ matrix.name }}" "../build"
